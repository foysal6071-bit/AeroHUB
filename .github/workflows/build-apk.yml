name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip the project
        run: |
          ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './_src/*' | head -n1)
          if [ -z "$ZIP" ]; then echo "No zip file found in the repo"; exit 1; fi
          echo "Using: $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src
          SETTINGS=$(find _src \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/__MACOSX/*' | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "No Gradle project (settings.gradle) found inside the zip"
            find _src -maxdepth 3
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          cd "$ROOT"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Name the APK
        run: |
          APK=$(find "$ROOT" -path '*outputs/apk/debug/*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          cp "$APK" "MyKuzu-build-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyKuzu-apk
          path: MyKuzu-build-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MyKuzu build ${{ github.run_number }}
          files: MyKuzu-build-*.apk
          generate_release_notes: true
