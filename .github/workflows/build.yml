name: Build APK from ZIP

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find and unzip the project
        run: |
          ZIP=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -i '\.zip$' | head -n1 || true)
          if [ -z "$ZIP" ]; then ZIP=$(find . -maxdepth 2 -iname '*.zip' | head -n1 || true); fi
          if [ -z "$ZIP" ]; then echo "No zip file found in the repo"; exit 1; fi
          echo "Using: $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          SETTINGS=$(find _src \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
          if [ -z "$SETTINGS" ]; then echo "No Gradle project found inside the zip"; exit 1; fi
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p "$ROOT" assembleDebug --stacktrace

      - name: Name the APK
        run: |
          APK=$(find "$ROOT" -path '*outputs/apk/debug/*.apk' | head -n1)
          cp "$APK" "MyKuzu-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MyKuzu-apk
          path: MyKuzu-build-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MyKuzu build ${{ github.run_number }}
          files: MyKuzu-build-*.apk
          generate_release_notes: true
