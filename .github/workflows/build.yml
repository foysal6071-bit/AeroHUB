name: Unzip, Build & Release APK

on:
  push:
    branches: [main, master]
    paths:
      - "*.zip"                 # রিপোর ROOT-এ নতুন/আপডেট করা zip আপলোড করলেই চলবে
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write               # Release বানানোর জন্য দরকার

env:
  APP_NAME: AeroHUB

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 1) Unzip ----------
      - name: Unzip project
        id: src
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          SRC=.
          if [ -n "$ZIP" ]; then
            echo "Unzipping: $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            SRC=_src
          else
            echo "No zip found - using repo root"
          fi

          SETTINGS=$(find "$SRC" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) খুঁজে পাওয়া যায়নি - zip-এর ভেতরে Android project আছে কিনা দেখুন"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # BouncyCastle duplicate-class সমস্যার ফিক্স (libadb-android jdk15to18 ব্যবহার করে)
      - name: Fix BouncyCastle duplicate classes
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          sed -i 's|org.bouncycastle:bcpkix-jdk18on:[0-9.]*|org.bouncycastle:bcpkix-jdk15to18:1.81|' app/build.gradle.kts
          grep -n bouncycastle app/build.gradle.kts

      # ---------- 2) Build ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          set -o pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --console=plain 2>&1 | tee build-debug.log
          else
            gradle assembleDebug --console=plain 2>&1 | tee build-debug.log
          fi

      # Optimized (R8 shrink) release APK. ব্যর্থ হলেও debug APK release-এ যাবে।
      - name: Build release APK (optimized)
        id: relbuild
        continue-on-error: true
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          set -o pipefail
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --console=plain 2>&1 | tee build-release.log
          else
            gradle assembleRelease --console=plain 2>&1 | tee build-release.log
          fi

      - name: Show errors only
        if: failure() || steps.relbuild.outcome == 'failure'
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          echo "=============== ERRORS ==============="
          cat build-*.log | grep -nE "^e: |error:|What went wrong|Execution failed|Could not|Duplicate class|Missing class|R8|requires" -A4 | head -100

      # ---------- Sign release APK ----------
      # Release APK sign না থাকলে ফোনে install হয় না। Repo secrets-এ KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD দিলে সবসময় একই key দিয়ে sign হবে (update হিসেবে install হবে)।
      - name: Sign release APK
        id: sign
        if: steps.relbuild.outcome == 'success'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          REL=$(find "${{ steps.src.outputs.dir }}" -path '*build/outputs/apk/release/*.apk' | head -n1)
          if [ -z "$REL" ]; then echo "::warning::release APK পাওয়া যায়নি"; exit 0; fi
          BT=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          OUT="${APP_NAME}-build-${{ github.run_number }}-release.apk"

          if "$APKSIGNER" verify "$REL" >/dev/null 2>&1; then
            echo "Release APK আগে থেকেই signed (project-এর signingConfig)।"
            cp "$REL" "$OUT"
          else
            if [ -n "$KEYSTORE_B64" ]; then
              echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
              KS="$RUNNER_TEMP/release.keystore"; KP="$KEYSTORE_PASSWORD"; KA="${KEY_ALIAS:-pocket}"; KKP="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "Signing with the key from repository secrets."
            else
              echo "::warning::KEYSTORE_BASE64 secret নেই - এই build-এর জন্য নতুন key বানানো হচ্ছে। প্রতি build-এ key আলাদা হবে, তাই পুরনো app-এর ওপর update হবে না। Secrets যোগ করুন।"
              KS="$RUNNER_TEMP/release.keystore"; KP="android123"; KA="release"; KKP="android123"
              keytool -genkeypair -keystore "$KS" -storepass "$KP" -keypass "$KKP" -alias "$KA" \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=${APP_NAME}"
            fi
            "$APKSIGNER" sign --ks "$KS" --ks-pass "pass:$KP" --ks-key-alias "$KA" --key-pass "pass:$KKP" --out "$OUT" "$REL"
            "$APKSIGNER" verify "$OUT"
          fi
          ls -la "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Collect debug APK
        id: apk
        run: |
          APK=$(find "${{ steps.src.outputs.dir }}" -path '*build/outputs/apk/debug/*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::APK তৈরি হয়নি"
            exit 1
          fi
          OUT="${APP_NAME}-build-${{ github.run_number }}-debug.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk-debug
          path: ${{ steps.apk.outputs.file }}

      - name: Upload artifact (release)
        if: steps.sign.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk-release
          path: ${{ steps.sign.outputs.file }}

      # ---------- 3) Release ----------
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.APP_NAME }} build ${{ github.run_number }}
          files: |
            ${{ steps.sign.outputs.file }}
            ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          make_latest: true